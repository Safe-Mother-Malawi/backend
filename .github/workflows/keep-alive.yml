name: Keep Backend Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" https://safemothermalawi-backend.onrender.com/api/v1/health)
          
          if [ $response -eq 200 ]; then
            echo "✅ Backend is awake! (HTTP $response)"
          else
            echo "⚠️ Backend responded with HTTP $response"
          fi
          
      - name: Ping Health Facilities Endpoint
        run: |
          echo "Pinging health facilities endpoint"
          curl -s https://safemothermalawi-backend.onrender.com/api/v1/health-facilities > /dev/null
          echo "✅ Health facilities endpoint pinged"
